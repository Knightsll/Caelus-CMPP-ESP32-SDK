dependencies:
  espressif/esp-tflite-micro:
    version: "1.4.1"
    rules:
      - if: "target == esp32s3"
  esphome/esp-micro-speech-features:
    version: "1.2.3"
    rules:
      - if: "target == esp32s3"
  espressif/esp-sr:
    version: "2.6.1"
    rules:
      - if: "target == esp32s3"
  espressif/esp_codec_dev:
    version: "1.6.2"
    rules:
      - if: "target == esp32s3"
  dns_server:
    path: ${IDF_PATH}/examples/protocols/http_server/captive_portal/components/dns_server
  espressif/cjson: "1.*"
  espressif/mcp-c-sdk: "2.0.1"
  espressif/mqtt: "1.1.0"
  espressif/mdns: "^1.11.3"
  espressif/network_provisioning: "1.4.0"
